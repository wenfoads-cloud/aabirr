services:
  - type: web
    name: aabir
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_VERSION
        value: "22"
    disk:
      name: aabir-data
      mountPath: /data
      sizeGB: 5
